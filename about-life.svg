<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">The Grimoire of Skills</title>
<desc id="desc">An original illustrated two-page spellbook describing Prakash Karekar's verified skills and profile notes.</desc>
<defs>
 <linearGradient id="book" x2="0" y2="1"><stop stop-color="#f2e9d8"/><stop offset="1" stop-color="#cbb98f"/></linearGradient>
 <filter id="bookShadow"><feGaussianBlur stdDeviation="12"/></filter>
 <style>.serif{font-family:Georgia,'Times New Roman',serif}.sans{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:ui-monospace,Consolas,monospace}@keyframes page{50%{transform:rotate(1deg) translateY(-2px)}}@keyframes rune{50%{opacity:.35}}.page{animation:page 7s ease-in-out infinite}.rune{animation:rune 4s ease-in-out infinite}</style>
</defs>
<rect width="1200" height="650" rx="24" fill="#090909"/><ellipse cx="600" cy="580" rx="500" ry="38" fill="#000" opacity=".7" filter="url(#bookShadow)"/>
<g class="page">
 <path d="M600 115Q445 58 100 118v430q350-62 500 0z" fill="url(#book)" stroke="#7a5524" stroke-width="4"/>
 <path d="M600 115q155-57 500 3v430q-350-62-500 0z" fill="url(#book)" stroke="#7a5524" stroke-width="4"/>
 <path d="M600 115v433" stroke="#7a5524" stroke-width="6"/><path d="M124 154q290-44 438 6m-438 68q280-42 438 4m-438 68q275-42 438 4m-438 68q270-42 438 4m-438 68q275-42 438 4M1076 157q-290-44-438 3m438 68q-280-42-438 4m438 68q-275-42-438 4m438 68q-270-42-438 4m438 68q-275-42-438 4" stroke="#7a5524" stroke-opacity=".22"/>
 <text x="142" y="182" class="serif" fill="#171717" font-size="31" font-weight="700">THE GRIMOIRE</text><text x="142" y="211" class="sans" fill="#8b1e24" font-size="12" letter-spacing="3">CREATION THROUGH PRACTICE</text>
 <g class="sans" fill="#171717"><text x="142" y="270" font-size="19" font-weight="700">SOFTWARE ENGINEERING</text><text x="142" y="298" font-size="15">Creation Magic — turning ideas into</text><text x="142" y="320" font-size="15">reliable, usable software.</text><text x="142" y="372" font-size="19" font-weight="700">CLOUD COMPUTING</text><text x="142" y="400" font-size="15">Sky Realm Magic — building beyond</text><text x="142" y="422" font-size="15">the local machine.</text><text x="142" y="474" font-size="19" font-weight="700">MOBILE DEVELOPMENT</text><text x="142" y="502" font-size="15">Pocket Realm Magic — experiences</text><text x="142" y="524" font-size="15">designed for life on the move.</text></g>
 <g transform="translate(490 207)" fill="none" stroke="#8b1e24" stroke-width="3" class="rune"><circle cx="110" cy="110" r="82"/><circle cx="110" cy="110" r="57"/><path d="M110 22l18 61 61 27-61 27-18 61-18-61-61-27 61-27z"/></g>
 <text x="650" y="182" class="serif" fill="#171717" font-size="31" font-weight="700">BEYOND THE BATTLE</text><text x="650" y="211" class="sans" fill="#8b1e24" font-size="12" letter-spacing="3">FIELD NOTES</text>
 <text x="650" y="270" class="serif" fill="#171717" font-size="23">A quiet page for the next chapter.</text><text x="650" y="310" class="sans" fill="#171717" font-size="15">Curiosity is the first spell.</text><text x="650" y="342" class="sans" fill="#171717" font-size="15">Craft is the second.</text><text x="650" y="374" class="sans" fill="#171717" font-size="15">Consistency is the one that lasts.</text>
 <path d="M650 420h320" stroke="#8b1e24" stroke-width="2"/><text x="650" y="458" class="mono" fill="#7a5524" font-size="12">PROFILE / BELAGAVI / 2026</text><text x="650" y="496" class="sans" fill="#171717" font-size="15">Verified links and mission records</text><text x="650" y="520" class="sans" fill="#171717" font-size="15">remain readable outside the lore.</text>
</g>
<text x="600" y="625" text-anchor="middle" class="mono" fill="#c9a45c" font-size="11" letter-spacing="2">THE BOOK OPENS WHERE THE WORK BEGINS</text>
</svg>
