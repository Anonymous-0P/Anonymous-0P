<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Magic Knight dossier</title>
<desc id="desc">An original parchment dossier for Prakash Karekar with factual project and repository records.</desc>
<defs><linearGradient id="parch" x2="0" y2="1"><stop stop-color="#e6d8b8"/><stop offset="1" stop-color="#bca87c"/></linearGradient><style>.serif{font-family:Georgia,'Times New Roman',serif}.sans{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:ui-monospace,Consolas,monospace}@keyframes seal{50%{transform:rotate(2deg) translateY(-2px)}}.seal{animation:seal 5s ease-in-out infinite;transform-origin:975px 470px}</style></defs>
<rect width="1200" height="650" fill="#090909"/><path d="M0 0h1200v62l-80-62zM0 650h1200v-62l-80 62z" fill="#171717"/><text x="70" y="78" class="sans" fill="#c72c35" font-size="13" letter-spacing="4">CHAPTER 03 · MAGIC KNIGHT RECORD</text><text x="70" y="122" class="serif" fill="#f2e9d8" font-size="40">A developer dossier, not a corporate dashboard.</text>
<path d="M72 160h470v398H72z" fill="url(#parch)" stroke="#7a5524" stroke-width="4"/><path d="M102 192h410M102 524h410" stroke="#8b1e24" stroke-width="2"/><text x="104" y="225" class="sans" fill="#8b1e24" font-size="12" letter-spacing="3">MAGIC KNIGHT PROFILE</text><text x="104" y="278" class="serif" fill="#171717" font-size="34" font-weight="700">Prakash Karekar</text><text x="104" y="310" class="sans" fill="#171717" font-size="16">Software Developer</text><circle cx="430" cy="330" r="72" fill="#171717" stroke="#c9a45c" stroke-width="4"/><path d="M395 300q35-52 70 0v60h-70z" fill="#c72c35"/><path d="M378 400q52-62 104 0v52H378z" fill="#171717"/><text x="104" y="376" class="sans" fill="#171717" font-size="14">THEMATIC AFFILIATION</text><text x="104" y="402" class="serif" fill="#8b1e24" font-size="23">Original Magic Knight</text><text x="104" y="452" class="sans" fill="#171717" font-size="14">Location · Belagavi</text><text x="104" y="478" class="mono" fill="#7a5524" font-size="12">GRIMOIRE / OPEN / 2026</text>
<g transform="translate(610 180)" class="sans"><text fill="#c9a45c" font-size="12" letter-spacing="3">MISSION RECORD</text><path d="M0 25h500" stroke="#c72c35" stroke-width="2"/><text y="78" fill="#f2e9d8" font-size="27" class="serif">Current quest</text><text y="111" fill="#e6d8b8" font-size="19">Rotra Logistics</text><text y="142" fill="#a8a39a" font-size="14">Featured project named by the profile owner.</text><text y="208" fill="#f2e9d8" font-size="27" class="serif">Public grimoire records</text><text y="241" fill="#a8a39a" font-size="14">Repository count and star totals are omitted</text><text y="263" fill="#a8a39a" font-size="14">until verified from GitHub.</text><text y="329" fill="#f2e9d8" font-size="27" class="serif">Recognition</text><text y="362" fill="#a8a39a" font-size="14">No unverified achievements are inscribed.</text><path d="M0 405h500" stroke="#c72c35" stroke-width="2"/><text y="445" fill="#e6d8b8" font-size="14">Thematic ranks describe the artwork only.</text><text y="470" fill="#e6d8b8" font-size="14">They are not real employment credentials.</text></g>
<g class="seal"><circle cx="975" cy="470" r="42" fill="#8b1e24" stroke="#c9a45c" stroke-width="4"/><path d="M975 442l9 18 20 3-15 14 4 20-18-10-18 10 4-20-15-14 20-3z" fill="#e6d8b8"/><text x="975" y="532" text-anchor="middle" class="mono" fill="#c9a45c" font-size="10">SEALED RECORD</text></g>
</svg>
