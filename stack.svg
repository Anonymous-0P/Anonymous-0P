<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
<title id="title">Magic Attribute System</title>
<desc id="desc">Supplied illustrated magic-circle skills artwork.</desc>
<defs><style>@keyframes glyph{to{transform:rotate(360deg)}}.glyph{animation:glyph 40s linear infinite;transform-origin:800px 400px}</style></defs>
<image href="assets/skills-magic-circle.png" x="0" y="0" width="1600" height="800" preserveAspectRatio="xMidYMid slice"/>
<circle class="glyph" cx="800" cy="400" r="220" fill="none" stroke="#C9A45C" stroke-opacity=".22" stroke-dasharray="2 16"/>
</svg>
